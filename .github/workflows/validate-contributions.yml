name: validate-contributions

# Two advisory checks, pre-Foundation (branch protection requires neither; a
# maintainer may merge regardless — see CONTRIBUTING.md):
#   validate         — structural validation of primitive + bundle records
#                      (reports, never writes back).
#   derived-indexes  — confirms the committed derived indexes (resolve / taxonomy /
#                      catalog) are regenerated and consistent with the corpus, i.e.
#                      a change didn't land without re-running generate-indexes.py.

on:
  pull_request:
    paths:
      - 'contributions/**'
      - 'primitives/**'
      - 'indexes/**'
      - 'scripts/validate_contributions.py'
      - 'scripts/generate-indexes.py'
      - '.github/workflows/validate-contributions.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Advisory structural validation
        run: python scripts/validate_contributions.py

  derived-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Derived indexes up to date (resolve / taxonomy / catalog)
        # --dry-run rebuilds in memory and byte-compares against the committed
        # files: exit 0 = match, 2 = stale (regenerate), 1 = validation error.
        run: python scripts/generate-indexes.py --dry-run
